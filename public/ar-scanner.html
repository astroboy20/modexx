<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }

    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    #status-sub   { font-size: 13px; opacity: 0.6; }

    /* scan frame */
    #scan-ui {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #scan-ui.hidden { display: none; }

    .frame {
      width: 260px; height: 260px; position: relative;
    }
    .corner {
      position: absolute; width: 28px; height: 28px;
    }
    .corner.tl { top:0;    left:0;  border-top:  4px solid var(--accent); border-left:  4px solid var(--accent); border-radius: 6px 0 0 0; }
    .corner.tr { top:0;    right:0; border-top:  4px solid var(--accent); border-right: 4px solid var(--accent); border-radius: 0 6px 0 0; }
    .corner.bl { bottom:0; left:0;  border-bottom: 4px solid var(--accent); border-left: 4px solid var(--accent); border-radius: 0 0 0 6px; }
    .corner.br { bottom:0; right:0; border-bottom: 4px solid var(--accent); border-right: 4px solid var(--accent); border-radius: 0 0 6px 0; }
    .laser {
      position: absolute; left: 8px; right: 8px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: laser 2.4s ease-in-out infinite;
    }
    @keyframes laser {
      0%   { top: 8px; opacity: 1; }
      50%  { top: calc(100% - 10px); opacity: 0.7; }
      100% { top: 8px; opacity: 1; }
    }

    .hint {
      margin-top: 24px; text-align: center; color: #fff;
      font-family: -apple-system, sans-serif;
    }
    .hint-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .hint-sub   { font-size: 13px; opacity: 0.75; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .hint-badge {
      display: inline-block; margin-top: 10px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 600;
    }

    /* wrong QR flash */
    #wrong-flash {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(220,50,50,0.9); color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      z-index: 200; opacity: 0;
      transition: opacity 0.2s;
    }
    #wrong-flash.show { opacity: 1; }

    /* success */
    #success {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
      font-family: -apple-system, sans-serif;
    }
    #success.hidden { display: none; }
    .success-box {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 40px 32px;
      text-align: center; color: #fff; max-width: 320px;
    }
    .check { font-size: 56px; margin-bottom: 16px; }
    .success-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .success-sub   { font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>

  <div id="overlay">
    <div class="spinner"></div>
    <div id="status-title">Starting camera…</div>
    <div id="status-sub">Allow camera access when prompted</div>
  </div>

  <div id="scan-ui" class="hidden">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="laser"></div>
    </div>
    <div class="hint">
      <div class="hint-title">Scan the hotspot QR code</div>
      <div class="hint-sub">Point at the glowing marker on the portrait screen</div>
      <div class="hint-badge" id="target-badge">Loading…</div>
    </div>
  </div>

  <div id="wrong-flash">Wrong hotspot — find the pulsating one</div>

  <div id="success" class="hidden">
    <div class="success-box">
      <div class="check">✅</div>
      <div class="success-title">Hotspot Unlocked!</div>
      <div class="success-sub" id="success-label"></div>
    </div>
  </div>

  <!-- jsQR from CDN — pure UMD, no module system needed -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    var params     = new URLSearchParams(location.search);
    var slug       = params.get('slug')      || '';
    var hotspotId  = params.get('hotspotId') || '';
    var label      = params.get('label')     || '';
    var accent     = params.get('accent') === 'blue' ? '#46a9d8' : '#168447';

    document.documentElement.style.setProperty('--accent', accent);
    document.getElementById('target-badge').textContent = label ? ('Target: ' + label) : '';

    var video   = document.getElementById('video');
    var canvas  = document.getElementById('canvas');
    var ctx     = canvas.getContext('2d');
    var rafId   = null;
    var done    = false;
    var wrongCooldown = false;

    function setStatus(title, sub) {
      document.getElementById('status-title').textContent = title;
      document.getElementById('status-sub').textContent   = sub || '';
    }

    function postToParent(type, data) {
      try { window.parent.postMessage(Object.assign({ type: type }, data), '*'); } catch(e) {}
    }

    function showWrongFlash() {
      if (wrongCooldown) return;
      wrongCooldown = true;
      var el = document.getElementById('wrong-flash');
      el.classList.add('show');
      setTimeout(function() {
        el.classList.remove('show');
        wrongCooldown = false;
      }, 2000);
    }

    function onDetected() {
      done = true;
      if (rafId) cancelAnimationFrame(rafId);
      video.srcObject && video.srcObject.getTracks().forEach(function(t){ t.stop(); });

      document.getElementById('scan-ui').classList.add('hidden');
      document.getElementById('success-label').textContent = label;
      document.getElementById('success').classList.remove('hidden');

      postToParent('AR_DETECTED', { hotspotId: hotspotId, slug: slug });
    }

    function scanFrame() {
      if (done) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert'
        });
        if (code) {
          // Expected URL pattern: .../monuments/<slug>/scan/<hotspotId>
          var expected = '/monuments/' + slug + '/scan/' + hotspotId;
          if (code.data.indexOf(expected) !== -1) {
            onDetected();
            return;
          } else if (code.data.indexOf('/monuments/' + slug + '/scan/') !== -1) {
            // It's a valid hotspot QR but the wrong one
            showWrongFlash();
          }
        }
      }
      rafId = requestAnimationFrame(scanFrame);
    }

    async function init() {
      try {
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(function(resolve) { video.onloadedmetadata = resolve; });
        await video.play();

        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('scan-ui').classList.remove('hidden');

        scanFrame();
      } catch(err) {
        console.error('[Scanner]', err);
        setStatus('Camera error', err.message || 'Could not access camera');
        postToParent('AR_ERROR', { message: err.message || 'Camera access denied' });
      }
    }

    init();
  </script>
</body>
</html>
